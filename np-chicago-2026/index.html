<style id="app-css">
/* Layout: road-case show book. Sticky header, left rail of departments (top chip bar on phones), one section on screen at a time. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#161A2C; --muted:#5A6272; --line:#DADFE7;
  --accent:#28519D; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA;
  --ok:#17795F; --ok-soft:#DDF3EC; --warn:#A8560B; --warn-soft:#FBEBD9; --crit:#BE2F5B; --crit-soft:#FBE1E9;
  --band:#161A2C; --band-ink:#F1F3F7; --band-muted:#A9B0C2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#161A2B; --surface-2:#1B2034; --ink:#E7EAF2; --muted:#9AA2B4; --line:#2A3046;
  --accent:#86A9F2; --accent-ink:#0E1120; --accent-soft:#1E2A4A;
  --ok:#55C9A6; --ok-soft:#14302A; --warn:#EBA457; --warn-soft:#3A2814; --crit:#F27A9F; --crit-soft:#3C1A27;
  --band:#090B16; --band-ink:#E7EAF2; --band-muted:#8D95A9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#161A2B; --surface-2:#1B2034; --ink:#E7EAF2; --muted:#9AA2B4; --line:#2A3046;
  --accent:#86A9F2; --accent-ink:#0E1120; --accent-soft:#1E2A4A;
  --ok:#55C9A6; --ok-soft:#14302A; --warn:#EBA457; --warn-soft:#3A2814; --crit:#F27A9F; --crit-soft:#3C1A27;
  --band:#090B16; --band-ink:#E7EAF2; --band-muted:#8D95A9; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.band{background:var(--band);color:var(--band-ink);padding-block:18px 16px;padding-inline:20px}
.band-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--band-muted)}
.band h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1;margin:4px 0 6px;letter-spacing:.01em;text-wrap:balance}
.band .sub{color:var(--band-muted);font-size:14px}
.band .sub b{color:var(--band-ink);font-weight:500}
.count{display:flex;gap:18px;align-items:flex-end}
.count .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--band-muted)}
.count .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.band .btn{background:transparent;color:var(--band-ink);border-color:#3A4160}
.band .btn.primary{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.btn svg{width:15px;height:15px;flex:none}

/* shell */
.shell{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.rail .grp{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--muted);margin:14px 10px 4px}
nav.rail .grp:first-child{margin-top:0}
nav.rail a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:500}
nav.rail a:hover{background:var(--surface)}
nav.rail a[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
nav.rail a .pill{font-size:11px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:0 60px}
  nav.rail{flex-direction:row;overflow-x:auto;gap:6px;padding-block:10px;margin-inline:-20px;padding-inline:20px;background:var(--bg);z-index:5;top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
  nav.rail .grp{display:none}
  nav.rail a{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:5px 10px;font-size:14px}
}
main{min-width:0}
.sechead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.sechead h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.sechead p{margin:6px 0 0;color:var(--muted);max-width:70ch}
h3{font-family:var(--display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.12em;margin:28px 0 10px;color:var(--ink)}
h3:first-child{margin-top:0}
.stack{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h4{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.01em}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px;padding-top:1px}
.kv dd{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.src{background:var(--surface-2);border-color:var(--line);color:var(--ink);font-weight:500}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.q{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;width:56px;font-weight:600}
td.sub{color:var(--muted);font-size:13px}
td.mono{white-space:nowrap}
tr.grouprow td{background:var(--surface-2);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
.tw input,.tw select{width:100%;min-width:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:4px 6px;font:inherit;font-size:13px}
.tw input.qty{min-width:50px;width:60px;text-align:right}
.rm{border:0;background:none;color:var(--crit);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}

/* schedule */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day .d{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.day .w{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted)}
.day .t{font-weight:600}
.day.show{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day ul{margin:4px 0 0;padding-left:16px;font-size:13px;color:var(--muted)}

/* gallery */
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.shot{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:zoom-in;text-align:left;min-width:0}
.shot:hover{border-color:var(--accent)}
.shot .img{aspect-ratio:3/2;max-width:100%;background:#0b0d16;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.shot.wide .img{aspect-ratio:16/5}
.shot img{width:100%;height:100%;object-fit:contain}
.shot .cap{display:flex;justify-content:space-between;gap:8px;padding:0 4px 2px;align-items:baseline}
.shot .cap b{font-weight:600}
.hero-shot{cursor:zoom-in;display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0b0d16}
.hero-shot img{display:block;width:100%}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(6,8,16,.96);z-index:50;display:flex;flex-direction:column;color:#EEF0F6}
.lb-top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.lb-top .t{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-top .btn{background:transparent;color:#EEF0F6;border-color:#3A4160}
.lb-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
.lb-stage.actual{display:block}
.lb-stage.actual img{max-width:none;max-height:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(20,24,40,.8);border:1px solid #3A4160;color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:20px}
.lb-prev{left:12px}.lb-next{right:12px}

/* issues */
.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.issue .sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line)}
.issue.high .sev{background:var(--crit)}.issue.med .sev{background:var(--warn)}.issue.low .sev{background:var(--muted)}
.issue.resolved{opacity:.6}
.issue .title{font-weight:600}
.issue .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.issue p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:80ch}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* LED */
.surf{display:grid;grid-template-columns:13.12fr 59.06fr 13.12fr;gap:6px;align-items:start;margin:4px 0 6px}
.surf div{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:6px;min-width:0;overflow:hidden}
.surf .side{aspect-ratio:4000/4500}
.surf .main{aspect-ratio:18000/4000}
.surf b{font-family:var(--display);font-size:15px;letter-spacing:.03em}
.surf .num{font-size:11px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.flow .n{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px}
.flow .a{color:var(--muted)}

/* swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw .c{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0}
.sw .c i{display:block;height:54px}
.sw .c span{display:block;padding:6px 9px;font-size:12px}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.file b{font-weight:600}
.file .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* map */
.mapbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mapbox svg{display:block;width:100%;height:auto}

/* edit bar + toast */
.editbar{position:sticky;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.editbar .btn{background:transparent;color:var(--bg);border-color:var(--muted)}
.editbar .btn.primary{background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;z-index:60}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px}
.upd{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.upd:last-child{border-bottom:0}
textarea.ed{width:100%;min-height:60px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:6px;font:inherit}
@media (prefers-reduced-motion:no-preference){.btn,.shot,nav.rail a{transition:border-color .15s,background-color .15s}}
</style>

/* downloads */
function download(k){
  var f=FILES[k];
  if(!dl){
    if(f.path){window.open(f.path,"_blank")}else{toast("Downloads aren't available in this view. Open the page in Claude to get the .zip.")}
    return;
  }
  var name=f.path?f.path.split("/").pop():f.zip;
  toast("Preparing "+name+"…");
  var job;
  if(f.bundle){
    if(!window.JSZip){toast("Zip tool didn't load — try again in a moment.");return}
    var z=new JSZip(),root=f.zip.replace(/\.zip$/,"");
    job=Promise.all(f.bundle.map(function(p){return fetch(p).then(function(r){if(!r.ok)throw new Error(p);return r.blob()}).then(function(b){z.file(root+"/"+p.replace(/^files\//,""),b)})}))
      .then(function(){return z.generateAsync({type:"blob"})});
  } else {
    job=fetch(f.path).then(function(r){if(!r.ok)throw new Error("fetch");return r.blob()});
  }
  job.then(function(b){return dl.save({filename:name,data:b})}).then(function(){},function(e){
    if(e&&e.code==="declined")return;
    toast(f.path?"Download didn't start — use Open instead.":"Couldn't build the zip — try again.");
  });
}
/* publish */
function save(){
  if(!art||CREW)return;
  S.savedAt=new Date().toISOString();
  var json=JSON.stringify(S,function(k,v){return k==="_i"?undefined:v},1);
  toast("Saving…");
  art.publish({"data/show.json":{content:json,contentType:"application/json"}}).then(function(){
    dirty=false;editing=false;toast("Saved — everyone with the link sees it now");render();
  },function(e){
    var c=e&&e.code;
    if(c==="conflict"){toast("Someone else saved first — reloading their version.");return}
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="capability_disabled"){canWrite=false;editing=false;render();toast("Saving isn't available in this view.");return}
    toast("Couldn't save ("+(c||"error")+"). Your edits are still here — try Save again.");
  });
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("button,a");if(!t)return;
  if(t.hasAttribute("data-copy")){copy(linkFor(t.getAttribute("data-copy")),"Link copied — send it to the team");return}
  if(t.hasAttribute("data-dl")){download(t.getAttribute("data-dl"));return}
  if(t.hasAttribute("data-lb")){openLB(t.getAttribute("data-lb"),+t.getAttribute("data-i"));return}
  if(t.hasAttribute("data-lbx")){closeLB();return}
  if(t.hasAttribute("data-lbn")){LB.i=(LB.i+1)%LB.list.length;LB.actual=false;drawLB();return}
  if(t.hasAttribute("data-lbp")){LB.i=(LB.i-1+LB.list.length)%LB.list.length;LB.actual=false;drawLB();return}
  if(t.hasAttribute("data-lbz")){LB.actual=!LB.actual;drawLB();return}
  if(t.hasAttribute("data-lbfs")){var el=$("#lb");try{var p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.catch)p.catch(function(){toast("Full screen isn't available here")})}catch(e){toast("Full screen isn't available here")}return}
  if(t.hasAttribute("data-hex")){copy(t.getAttribute("data-hex"),t.getAttribute("data-hex")+" copied");return}
